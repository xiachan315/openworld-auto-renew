name: Openworld 自动续期

on:
  schedule:
    # ★★★ 2026-10-06 第二版：改成「高频唤醒 + 当日随机时刻 + 当天只跑一次」。
    #
    # 为什么再改（实测结论）：
    #   ① GitHub 原生 schedule 只有 ±分钟级精度，且高负载时会 drop；
    #   ② 之前辅以 Cloudflare Worker 做外部触发器，但该账号的 Workers 运行时
    #      当天整体异常（连最小 hello-world worker 都返回 Error 1101），
    #      cron 触发器无法投递 ⇒ 外部触发器这条路不可依赖；
    #   ③ 只跑 12 次/天时，只要那一次被 drop，当天就彻底没机会。
    #
    # 现在的做法：每 20 分钟唤醒一次（72 次/天），用「当天 UTC 日期」的 sha256
    #   选出一个 0~71 的随机时段 ⇒ 当天目标时刻。过目标时刻后的**第一次**唤醒
    #   才真正执行；并用 actions/cache 打一个当天标记，保证当天不会重复执行。
    #   ⇒ 单次被 drop 不影响（后面还有很多次唤醒）；执行时刻每天随机、不固定。
    #
    # 时间维度的随机性由两层构成：①上面的「当日随机时刻」②daemon 内的
    #   OW_JITTER_MAX 抖动（命中后再随机等 0~20 分钟）。出口 IP 每轮随机（住宅节点）
    #   + 时间随机 ⇒ 不再是「每天同一分钟同一种行为」的机器人指纹。
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略阈值，强制尝试续期（用于验证链路）'
        required: false
        default: '0'
      # 外部调度器（如 Cloudflare Worker）自动触发时置 1。
      # 置 1 时不再豁免闸门，而是同样走「当日随机时刻」判定，
      # 否则每次外部触发都会跑完整续期流程。
      auto:
        description: '外部调度器自动触发；置 1 时同样走随机闸门'
        required: false
        default: '0'

permissions:
  contents: read
  actions: write

concurrency:
  group: openworld-renew
  cancel-in-progress: false

jobs:
  # ★★★ 随机时刻闸门（2026-10-06 第二版）
  #   ① 算出今天的目标时刻（日期种子 ⇒ 每天不同、且同一天 72 次唤醒答案一致）
  #   ② 没到目标时刻 ⇒ 空跑退出（不装依赖、不下 Chromium、不碰目标站）
  #   ③ 到了目标时刻 ⇒ 再查当日标记 cache：命中过就直接空跑（当天只执行一次）
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.final.outputs.run }}
      date: ${{ steps.when.outputs.date }}
    steps:
      - name: ① 计算今天的随机时刻
        id: when
        run: |
          AUTO="${{ github.event.inputs.auto }}"
          SEED=$(date -u +%Y%m%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$AUTO" != "1" ]; then
            echo "date=$SEED" >> "$GITHUB_OUTPUT"
            echo "time_ok=1" >> "$GITHUB_OUTPUT"
            echo "· 人工手动触发 ⇒ 跳过闸门，直接执行"
            exit 0
          fi
          H=$(printf '%s' "$SEED" | sha256sum | cut -c1-8)
          SLOT=$(( 16#$H % 72 ))
          TARGET_MIN=$(( SLOT * 20 ))
          NOW_MIN=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          echo "date=$SEED" >> "$GITHUB_OUTPUT"
          printf '日期=%s  目标时刻=%02d:%02d(UTC)  当前=%02d:%02d(UTC)\n' \
            "$SEED" $((TARGET_MIN/60)) $((TARGET_MIN%60)) $((NOW_MIN/60)) $((NOW_MIN%60))
          if [ "$NOW_MIN" -ge "$TARGET_MIN" ]; then
            echo "time_ok=1" >> "$GITHUB_OUTPUT"
            echo "✅ 已过今天的随机时刻 ⇒ 进入当日去重检查"
          else
            echo "time_ok=0" >> "$GITHUB_OUTPUT"
            echo "⏭ 还没到今天的随机时刻 ⇒ 空跑退出：不装依赖、不碰目标站"
          fi

      - name: ② 查当天是否已经执行过
        id: mark
        if: steps.when.outputs.time_ok == '1'
        uses: actions/cache/restore@v4
        with:
          path: .ow-try
          key: ow-try-${{ steps.when.outputs.date }}
          lookup-only: true

      - name: ③ 决定今天跑不跑
        id: final
        run: |
          if [ "${{ steps.when.outputs.time_ok }}" != "1" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.mark.outputs.cache-hit }}" = "true" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "⏭ 今天已经执行过（当日标记命中）⇒ 空跑退出"
            exit 0
          fi
          echo "run=1" >> "$GITHUB_OUTPUT"
          echo "✅ 今天首次到达随机时刻 ⇒ 执行续期"

  renew:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    # 60 分钟：随机抖动最多 20 分钟 + 住宅出口建立 + 验证码 + 续期，
    # 实测完整一轮 6.9 分钟，留足余量。
    timeout-minutes: 60
    env:
      # Clerk 会话 cookie（base64 的 JSON 数组）。在 repo 的
      # Settings -> Secrets and variables -> Actions 里加名为 OW_COOKIES_B64 的 secret。
      OW_COOKIES_B64: ${{ secrets.OW_COOKIES_B64 }}
      # Telegram 通知（bot token + chat id 都放 Secret，不入库）
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      # ★ 手动 force 调试时静默失败通知（避免刷屏）。
      #   cron 自动跑时不设 ⇒ 成功/失败都正常推送。
      TG_DEBUG: ${{ github.event.inputs.force == '1' && '1' || '' }}
      # 距到期多少小时内才真的续（daemon 侧还会兜底到 120）
      OW_THRESHOLD_H: ${{ github.event.inputs.force == '1' && '9999' || '72' }}
      # ★ 随机抖动（分钟）：命中窗口后、接触目标站前再随机等 0~20 分钟，
      #   让「读面板 / 解验证码 / 续期」的时刻在随机时刻之后再抖动一层。
      OW_JITTER_MAX: '20'
      # 验证码失败预算有限，重试最多 2 次
      OW_MAX_TRY: '2'
      # 每个 cron 跑几次「重开浏览器会话」：换题在同一会话里会失效
      # （实测 40 阶段题型不变），只有新会话能重新摇。
      # 平台有 24h 冷却 ⇒ 同一 cron 内多次尝试的边际收益递减，4 次够。
      OW_SESSIONS: '4'

    steps:
      # ★ 先打「今天已尝试」标记：无论后面成功失败，当天都不再重复触发。
      #   重试交给 daemon 内部（OW_MAX_TRY / OW_SESSIONS）+ 后续日期的窗口。
      - name: 标记今天已尝试
        run: |
          mkdir -p .ow-try
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .ow-try/tried.txt
          cat .ow-try/tried.txt
      - name: 保存当日标记
        uses: actions/cache/save@v4
        with:
          path: .ow-try
          key: ow-try-${{ needs.gate.outputs.date }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-fund --no-audit playwright-core@1.63.0

      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium

      - name: 检查凭据
        run: |
          if [ -z "$OW_COOKIES_B64" ]; then
            echo "::error::缺少 secret OW_COOKIES_B64（Clerk 会话 cookie）"
            exit 1
          fi
          echo "cookie 长度: $(echo -n "$OW_COOKIES_B64" | wc -c) base64 字符"

      - name: 跑续期
        run: node ow-auto-renew-daemon.mjs once

      - name: 上传诊断截图（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ow-renew-debug
          path: |
            *.png
            *.log
          if-no-files-found: ignore
          retention-days: 7
