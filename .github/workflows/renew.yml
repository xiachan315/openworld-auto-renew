name: Openworld 自动续期

on:
  schedule:
    # ★★★ 2026-10-06 改版：从「每天固定一次」改为「每 2 小时唤醒 + 随机时段闸门」。
    #
    # 为什么改（用户诉求）：原来 `23 8 * * *` 是雷打不动的 UTC 08:23（北京 16:23）。
    #   「每天都在同一分钟出现同一种自动化行为」本身就是一条显眼的机器人指纹 ——
    #   出口 IP 每轮都换（住宅节点随机）只解决了网络维度，时间维度仍是规律的。
    #   用户明确要求：别每天固定一个时间点，免得被风控盯上。
    #
    # 怎么改：GitHub 的 `schedule` 只支持固定 cron，无法直接写「随机」。
    #   所以这里改成**每 2 小时唤醒一次**（UTC 00/02/…/22，共 12 个窗口），
    #   再由第一个 job `gate` 用「当天 UTC 日期」做 sha256 种子，确定性地
    #   选出今天唯一的目标窗口；只有真正命中那个窗口的 run 才会继续跑，
    #   其余 11 次在 gate 里就地退出 —— 不装依赖、不下载 Chromium、不碰目标站，
    #   每次约 10~15 秒。
    #   ⇒ 实际执行时刻在一天 12 个窗口里随机，而不是固定的一分钟。
    #
    # 为什么是每 2 小时而不是更高频：平台有「24h 冷却」，每 24h 只能成功续 1 次。
    #   再高频也不会多成功一次，只会徒增 run 数。12 个窗口足够把执行时刻打散。
    #
    # 为什么用「日期种子」而不是 Math.random()：同一天会被唤醒 12 次，
    #   必须 12 次算出同一个答案，否则永远撞不上；而且确定性意味着事后可复现
    #   （能算出「那天本该几点跑」）。
    #
    # 阈值：workflow 侧给 72h，daemon 内部还会兜到 120h ⇒ 到期前 5 天进入窗口，
    #   约 5 次机会；题型在 5 种里随机、已通全部题型 ⇒ 全败概率极低。
    #   若某天那一次 schedule 恰好被 GitHub 丢弃（高负载时会 drop），
    #   还有前后几天的窗口兜底。
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略阈值，强制尝试续期（用于验证链路）'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: openworld-renew
  cancel-in-progress: false

jobs:
  # ★★★ 随机时段闸门（2026-10-06）
  #   把「固定时刻」变成「一天内 12 个窗口里随机一个」。
  #   手动触发（workflow_dispatch）时恒放行，方便随时验证链路。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: 决定今天在哪个窗口执行
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "· 手动触发 ⇒ 跳过闸门，直接执行"
            exit 0
          fi
          SEED=$(date -u +%Y%m%d)
          H=$(printf '%s' "$SEED" | sha256sum | cut -c1-8)
          TARGET=$(( 16#$H % 12 ))
          NOW=$(( 10#$(date -u +%H) / 2 ))
          echo "日期=$SEED  目标窗口=$TARGET（UTC $(printf '%02d' $((TARGET*2))):17）  当前窗口=$NOW"
          if [ "$NOW" -eq "$TARGET" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "✅ 命中今天的随机窗口 $TARGET ⇒ 继续执行"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "⏭ 未命中（今天窗口=$TARGET，当前=$NOW）⇒ 空跑退出：不装依赖、不碰目标站"
          fi

  renew:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    # 60 分钟：随机抖动最多 20 分钟 + 住宅出口建立 + 验证码 + 续期，
    # 实测完整一轮 6.9 分钟，留足余量。
    timeout-minutes: 60
    env:
      # Clerk 会话 cookie（base64 的 JSON 数组）。在 repo 的
      # Settings -> Secrets and variables -> Actions 里加名为 OW_COOKIES_B64 的 secret。
      OW_COOKIES_B64: ${{ secrets.OW_COOKIES_B64 }}
      # Telegram 通知（bot token + chat id 都放 Secret，不入库）
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      # ★ 手动 force 调试时静默失败通知（避免刷屏）。
      #   cron 自动跑时不设 ⇒ 成功/失败都正常推送。
      TG_DEBUG: ${{ github.event.inputs.force == '1' && '1' || '' }}
      # 距到期多少小时内才真的续（daemon 侧还会兜底到 120）
      OW_THRESHOLD_H: ${{ github.event.inputs.force == '1' && '9999' || '72' }}
      # ★ 随机抖动（分钟）：命中窗口后、接触目标站前再随机等 0~20 分钟，
      #   让「读面板 / 解验证码 / 续期」的时刻在窗口内也带分钟级随机，
      #   而不是卡在窗口起点的同一分钟。
      OW_JITTER_MAX: '20'
      # 验证码失败预算有限，重试最多 2 次
      OW_MAX_TRY: '2'
      # 每个 cron 跑几次「重开浏览器会话」：换题在同一会话里会失效
      # （实测 40 阶段题型不变），只有新会话能重新摇。
      # 平台有 24h 冷却 ⇒ 同一 cron 内多次尝试的边际收益递减，4 次够。
      OW_SESSIONS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-fund --no-audit playwright-core@1.63.0

      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium

      - name: 检查凭据
        run: |
          if [ -z "$OW_COOKIES_B64" ]; then
            echo "::error::缺少 secret OW_COOKIES_B64（Clerk 会话 cookie）"
            exit 1
          fi
          echo "cookie 长度: $(echo -n "$OW_COOKIES_B64" | wc -c) base64 字符"

      - name: 跑续期
        run: node ow-auto-renew-daemon.mjs once

      - name: 上传诊断截图（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ow-renew-debug
          path: |
            *.png
            *.log
          if-no-files-found: ignore
          retention-days: 7
