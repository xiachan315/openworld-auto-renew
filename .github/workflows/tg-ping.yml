name: ow-tg-ping
# 一次性用途：用仓库已有的 TG_TOKEN / TG_CHAT secret 手工推一条消息。
# 为什么需要它：本机跑的续期读不到 secret（secret 只对 Actions 可见），
# 所以「本机直连续期成功」这条通知没法从本机发出去。
on:
  workflow_dispatch:
    inputs:
      text:
        description: '要推送的文本'
        required: true
        default: 'test'
permissions:
  contents: read

concurrency:
  group: ow-tg-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 推送到 Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          set -eu
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::error::缺少 TG_TOKEN / TG_CHAT secret"
            exit 1
          fi
          code=$(curl -sS -o /tmp/tg.out -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true")
          echo "http=$code"
          if [ "$code" != "200" ]; then
            # 只回错误描述，绝不回显 token
            sed -e "s/${TG_TOKEN}/***/g" /tmp/tg.out | head -c 400
            exit 1
          fi
          echo "✅ 已推送"
